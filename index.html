        const ShaderBackground = () => {
            const canvasRef = useRef(null);
            useEffect(() => {
                const canvas = canvasRef.current;
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (!gl) return;

                const vs = `attribute vec2 a_position; varying vec2 v_texCoord; void main() { v_texCoord = a_position * 0.5 + 0.5; gl_Position = vec4(a_position, 0.0, 1.0); }`;
                const fs = `precision highp float; uniform float u_time; varying vec2 v_texCoord;
                    float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
                    float noise(vec2 p) { vec2 i = floor(p); vec2 f = fract(p); float a = hash(i); float b = hash(i + vec2(1.0, 0.0)); float c = hash(i + vec2(0.0, 1.0)); float d = hash(i + vec2(1.0, 1.0)); vec2 u = f * f * (3.0 - 2.0 * f); return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.x * u.y; }
                    void main() { vec2 uv = v_texCoord; float n = noise(uv * 3.0 + u_time * 0.05); n += 0.5 * noise(uv * 6.0 - u_time * 0.02); vec3 color = vec3(0.02, 0.04, 0.08); float mask = smoothstep(0.3, 0.0, uv.y); color = mix(color, vec3(0.05, 0.08, 0.12), mask * n); color += 0.03 * n; gl_FragColor = vec4(color, 1.0); }`;

                const createShader = (type, source) => {
                    const shader = gl.createShader(type);
                    gl.shaderSource(shader, source);
                    gl.compileShader(shader);
                    return shader;
                };

                const program = gl.createProgram();
                gl.attachShader(program, createShader(gl.VERTEX_SHADER, vs));
                gl.attachShader(program, createShader(gl.FRAGMENT_SHADER, fs));
                gl.linkProgram(program);
                gl.useProgram(program);

                const buffer = gl.createBuffer();
                gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
                gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

                const pos = gl.getAttribLocation(program, 'a_position');
                gl.enableVertexAttribArray(pos);
                gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

                const uTime = gl.getUniformLocation(program, 'u_time');
                
                const render = (t) => {
                    gl.viewport(0, 0, canvas.width, canvas.height);
                    gl.uniform1f(uTime, t * 0.001);
                    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                    requestAnimationFrame(render);
                };
                requestAnimationFrame(render);

                const syncSize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                window.addEventListener('resize', syncSize);
                syncSize();
                return () => window.removeEventListener('resize', syncSize);
            }, []);
